<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimesh Kulkarni - DevOps Engineer</title>
    <meta name="description" content="Portfolio of Nimesh Kulkarni, a DevOps engineer specializing in CI/CD, Docker, Kubernetes, AWS, and automation." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Critical CSS to prevent FOUC */
      :root {
        --background: 0 0% 98%;
        --foreground: 240 10% 4%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 4%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 10% 4%;
        --primary: 36 60% 45%;
        --primary-foreground: 0 0% 98%;
        --secondary: 240 5% 96%;
        --secondary-foreground: 240 6% 10%;
        --muted: 240 5% 96%;
        --muted-foreground: 240 4% 46%;
        --accent: 36 60% 45%;
        --accent-foreground: 0 0% 98%;
        --destructive: 0 84% 60%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 6% 90%;
        --input: 240 6% 90%;
        --ring: 36 60% 45%;
        --radius: 0.5rem;
      }

      .dark {
        --background: 0 0% 7%;
        --foreground: 36 20% 85%;
        --card: 0 0% 10%;
        --card-foreground: 36 20% 85%;
        --popover: 0 0% 10%;
        --popover-foreground: 36 20% 85%;
        --primary: 36 30% 70%;
        --primary-foreground: 0 0% 7%;
        --secondary: 0 0% 15%;
        --secondary-foreground: 36 20% 85%;
        --muted: 0 0% 20%;
        --muted-foreground: 36 10% 60%;
        --accent: 36 30% 70%;
        --accent-foreground: 0 0% 7%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 0 0% 20%;
        --input: 0 0% 20%;
        --ring: 36 30% 70%;
      }

      * {
        border-color: hsl(var(--border));
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
      }

      body.theme-loaded {
        opacity: 1;
      }
    </style>
    <script>
      // Apply theme immediately before React loads
      (function() {
        try {
          var savedTheme = localStorage.getItem('vite-ui-theme');
          var theme = savedTheme;
          var html = document.documentElement;
          html.classList.remove('dark', 'light');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
          } else {
            html.classList.add('light');
          }

          // Show content after theme is applied
          if (document.body) {
            document.body.classList.add('theme-loaded');
          } else {
            document.addEventListener('DOMContentLoaded', function() {
              document.body.classList.add('theme-loaded');
            });
          }
        } catch (e) {
          // Fallback if localStorage fails
          var html = document.documentElement;
          html.classList.remove('dark', 'light');
          html.classList.add(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.body.classList.add('theme-loaded');
        }
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CRGVM4Y01L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-CRGVM4Y01L');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <form name="contact" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
